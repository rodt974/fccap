    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.172.97.236
          username: root
          password: hR7uHRrCaL8U33
          command_timeout: 5m
          script: |
            set -e

            if ! command -v node &> /dev/null; then

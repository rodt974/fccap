name: Deploy Bot to VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Install Node.js
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs
            fi

            # Install pm2
            npm install -g pm2 2>/dev/null

            # Setup bot
            mkdir -p /root/buzzcast-bot/recordings
            cd /root/buzzcast-bot

            # Download bot files from repo
            curl -sL "https://raw.githubusercontent.com/rodt974/fccap/claude/buzzcast-telegram-recording-CYVwc/buzzcast-telegram-recorder/bot.js" -o bot.js
            curl -sL "https://raw.githubusercontent.com/rodt974/fccap/claude/buzzcast-telegram-recording-CYVwc/buzzcast-telegram-recorder/package.json" -o package.json

            # Install deps
            npm install

            # Stop old instance if running
            pm2 delete buzz 2>/dev/null || true

            # Start bot
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" pm2 start bot.js --name buzz
            pm2 save
            pm2 startup | tail -1 | bash 2>/dev/null || true

            echo "Bot deployed and running!"

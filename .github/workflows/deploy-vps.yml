            fi

            cd /root/buzzcast-bot/buzzcast-telegram-recorder
            mkdir -p recordings
            npm install

            pm2 delete buzz 2>/dev/null || true
            BOT_TOKEN="8757991844:AAEmpDhA-MRbmmkb-tnTXGSEl0cmDDwY5iM" pm2 start bot.js --name buzz --update-env
            pm2 save
            env PATH=$PATH:/usr/bin pm2 startup systemd -u root --hp /root 2>/dev/null || true
